function esc(value){return String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function exists(q){return !q.showIf || answers[q.showIf[0]] === q.showIf[1];}
function shown(q){return exists(q);}
function isScored(v){return typeof v === 'number' && Number.isFinite(v);}
function currentIds(page){return page.scenarios ? page.scenarios.flatMap(i=>[`RS${String(i).padStart(2,'0')}_A`,`RS${String(i).padStart(2,'0')}_B`]) : page.ids.filter(id=>exists(byId[id]));}
function publicKeyValid(key){
 if(typeof key!=='string')return false;
 if(/^sb_publishable_[A-Za-z0-9_-]{8,}$/.test(key))return true;
 if(!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(key))return false;
 try{return JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role==='anon';}catch(_){return false;}
}
function configProblems(){
 const list=[];
 if(STORAGE.provider!=='supabase'||!['live','preview'].includes(STORAGE.mode))list.push('Cấu hình chế độ khảo sát chưa hợp lệ.');
 if(STORAGE.rpcPrefix!==({'bts-pilot-v3.0.0':'survey_','bts-pilot-v3.1.0':'survey_v3_1_'}[BANK.version]))list.push('Kết nối lưu phiếu chưa khớp phiên bản bảng hỏi.');
 if(STORAGE.publishableKey&&!publicKeyValid(STORAGE.publishableKey.trim()))list.push('Chỉ dùng khóa Supabase publishable hoặc anon; không dùng secret hay service_role.');
 if(!isLive)return list;
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(STORAGE.url.trim()))list.push('Chưa cấu hình Project URL Supabase hợp lệ trong study.config.json.');
 if(!STORAGE.publishableKey.trim())list.push('Chưa cấu hình Publishable key Supabase trong study.config.json.');
 for(const k of ['researcher','institution','contactEmail','dataAccess','retention','ethicsInfo'])if(!STUDY[k].trim())list.push(`Chưa điền STUDY.${k}.`);
 if(STUDY.contactEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(STUDY.contactEmail))list.push('Địa chỉ liên hệ nghiên cứu chưa hợp lệ.');
 return list;
}

  INVALID_RESPONSE:'Máy chủ chưa trả về trạng thái khảo sát hợp lệ. Vui lòng liên hệ nhóm nghiên cứu để cập nhật kết nối.',
  NETWORK_ERROR:'Chưa kết nối được dịch vụ lưu phiếu. Vui lòng kiểm tra kết nối và thử lại.',
  BACKEND_NOT_INSTALLED:'Nơi lưu câu trả lời chưa được thiết lập. Vui lòng liên hệ người phụ trách khảo sát.',
  RATE_LIMITED:'Dịch vụ đang nhận nhiều yêu cầu. Vui lòng đợi một chút rồi thử lại.',
  SERVER_TIMEOUT:'Máy chủ chưa phản hồi kịp. Vui lòng thử lại; nếu tình trạng tiếp diễn, liên hệ nhóm nghiên cứu.',
  SECURE_CONTEXT_REQUIRED:'Trình duyệt chưa hỗ trợ tạo mã phiếu an toàn. Vui lòng mở khảo sát qua HTTPS bằng trình duyệt cập nhật.'
 };
 if(state.serverStatus==='unavailable')return messages[state.serverCode]||'Chưa xác nhận được khảo sát đã sẵn sàng nhận câu trả lời. Vui lòng thử lại hoặc liên hệ nhóm nghiên cứu.';

async function checkServer(){
 state.healthChecking=true;
 if(state.page===0)render(false);
 const result=await getHealth();
 state.healthChecking=false;state.serverStatus=result.status;state.serverCode=result.code||'';
 if(state.page===0)render(false);
 return result.status==='ready';
}
function chooseHtml(q,options,extraClass=''){
 return `<div class="options ${extraClass}">${options.map(([value,label])=>{
  const chosen=answers[q.id]===value;
  return `<label class="option"><input type="radio" name="${q.id}" value="${esc(value)}" ${chosen?'checked':''}><span>${esc(label)}</span></label>`;
 }).join('')}</div>`;
}
function scaleSelectionText(q){
 const value=answers[q.id];
 const selected=BANK.scales[q.scale].find(([v])=>v===value);
 return selected?`${selected[0]} · ${selected[1]}`:value==='SKIP'?'Không muốn trả lời':value==='NA'?'Không áp dụng / khó đánh giá':'Chọn một mức từ 1 đến 6.';
}
function questionHtml(q,ordinal){
 let html=`<fieldset class="question" id="field-${q.id}"><legend><span class="q-number">${esc(ordinal)}.</span>${esc(q.text)}${q.required?'<span class="required">Cần trả lời để xác định phạm vi tham gia.</span>':''}</legend>`;
 if(q.typeOverride==='select'){
  html+=`<label class="sr-only" for="input-${q.id}">${esc(q.text)}</label><select id="input-${q.id}" name="${q.id}"><option value="">Chọn tuổi</option>${q.options.map(([v,l])=>`<option value="${esc(v)}" ${answers[q.id]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
 }else if(q.scale){
  const opts=BANK.scales[q.scale];
  if(q.group==='rs'||q.group==='ed'){
   html+=`<div class="rs-anchors"><span>1 · ${esc(opts[0][1])}</span><span>6 · ${esc(opts[5][1])}</span></div>`;
   html+=`<div class="options rs-options">${opts.map(([v,l])=>`<label class="option"><input type="radio" name="${q.id}" value="${v}" ${answers[q.id]===v?'checked':''} aria-label="${v}${l===String(v)?'':' · '+esc(l)}"><span>${v}</span></label>`).join('')}</div>`;
  }else{
   html+=`<div class="options">${opts.map(([v,l])=>`<label class="option"><input type="radio" name="${q.id}" value="${v}" ${answers[q.id]===v?'checked':''}><span class="score" aria-hidden="true">${v}</span><span>${esc(l)}</span></label>`).join('')}</div>`;
  }
  if(q.group==='ed')html+=`<p class="hint scale-selection" id="selected-${q.id}">${esc(scaleSelectionText(q))}</p>`;
  html+=`<div class="missing-options">${[['SKIP','Không muốn trả lời'],['NA','Không áp dụng / khó đánh giá']].map(([v,l])=>`<label class="option missing"><input type="radio" name="${q.id}" value="${v}" ${answers[q.id]===v?'checked':''}><span>${l}</span></label>`).join('')}</div>`;
 }else html+=chooseHtml(q,q.options);
 return html+'</fieldset>';
}
function progressHtml(){return `<div class="progress-label"><span>Bước ${String(state.page).padStart(2,'0')} / ${pages.length}</span><span>${Math.round((state.page-1)/pages.length*100)}%</span></div><div class="progress" role="progressbar" aria-label="Tiến độ các phần khảo sát" aria-valuemin="0" aria-valuemax="${pages.length}" aria-valuenow="${state.page-1}"><span style="width:${(state.page-1)/pages.length*100}%"></span></div>`;}

  app.innerHTML=`<section class="hero"><div class="kicker">BÀI NGHIÊN CỨU TÂM LÝ HỌC TRONG TÌNH YÊU</div><div class="eclipse" aria-hidden="true"></div><h1 id="screen-title" tabindex="-1">LOVE<br>HAY LỐP</h1><p>Mối liên hệ giữa trải nghiệm bị breadcrumbing và sự lệ thuộc cảm xúc trong quan hệ tình cảm ở người trẻ Việt Nam: Kiểm định vai trò trung gian của độ nhạy cảm với sự từ chối.</p><div class="metadata"><span>18–30 tuổi</span><span>Tiếng Việt</span><span>Tham gia tự nguyện</span></div></section>

  ${problems.length?`<div class="error" role="alert"><strong>Chưa thể mở thu thập dữ liệu.</strong><p>${problems.map(esc).join('<br>')}</p></div>`:''}

  <p>Bạn có thể bỏ qua các câu không muốn trả lời hoặc dừng trước khi gửi. Các câu hỏi mang tính cá nhân được dùng để xác định phạm vi tham gia. Không có thưởng hoặc chi phí khi khảo sát.</p>
  <p>Một số tình huống nhắc đến quan hệ tình dục an toàn, cảm giác bị từ chối, tự làm hại bản thân hoặc hành vi liều lĩnh. Bạn không phải kể chi tiết trải nghiệm. Bảng hỏi không dùng để chẩn đoán và không có người theo dõi trực tiếp nhằm xử lý tình huống khẩn cấp.</p>
  <p>Khi bạn gửi, câu trả lời, mã phiếu ngẫu nhiên, phiên bản bảng hỏi và thông tin thời gian được lưu trong cơ sở dữ liệu do người phụ trách nghiên cứu quản lý. Câu trả lời không được công khai cho người tham gia khác.</p>

  if(page.scenarios){for(const i of page.scenarios){const a=byId[`RS${String(i).padStart(2,'0')}_A`],b=byId[`RS${String(i).padStart(2,'0')}_B`];html+=`<section class="scenario"><div class="scenario-head">Tình huống ${i} / 9</div><p class="scenario-text">${esc(a.scenario)}</p>${questionHtml(a,'A')}${questionHtml(b,'B')}</section>`;}}
  else currentIds(page).forEach((id,i)=>{html+=questionHtml(byId[id],i+1);});
  html+=`<div id="validation-error" class="error" role="alert">${esc(state.error)}</div><div class="actions"><button class="button secondary" id="back">← Quay lại</button><button class="button primary" id="next">${page.review?(isLive?'Gửi câu trả lời':'Hoàn tất xem thử'):'Tiếp tục'} <span aria-hidden="true">→</span></button></div><button class="text-button" id="exit">Dừng khảo sát và xóa phần chưa gửi</button>`;
  app.innerHTML=html;
  app.querySelectorAll('input[type="radio"],select').forEach(input=>input.addEventListener('change',e=>{
   const q=byId[e.target.name];let value=e.target.value;
   if(value===''){delete answers[q.id];return;}
   const choices=q.scale?BANK.scales[q.scale]:q.options;
   const original=choices.find(([v])=>String(v)===value);
   answers[q.id]=original?original[0]:value;
   if(q.group==='ed'){const selected=document.querySelector(`#selected-${q.id}`);if(selected)selected.textContent=scaleSelectionText(q);}
   state.error='';const err=document.querySelector('#validation-error');if(err)err.textContent='';
  }));
  document.querySelector('#back').addEventListener('click',()=>{state.page--;state.error='';render();});
  document.querySelector('#next').addEventListener('click',()=>{
   const missing=currentIds(page).filter(id=>byId[id].required && answers[id]===undefined);
   if(missing.length){state.error='Vui lòng trả lời câu cần thiết để xác định phạm vi tham gia.';const error=document.querySelector('#validation-error');error.textContent=state.error;document.querySelector(`#field-${missing[0]}`).scrollIntoView({block:'center'});document.querySelector(`#field-${missing[0]} input, #field-${missing[0]} select`)?.focus({preventScroll:true});return;}
   if(state.page===1 && (!Number.isInteger(answers.AGE)||answers.AGE<18||answers.AGE>30||answers.RESIDENCE_VN!=='yes'||answers.EXPERIENCE_12M!=='yes')){clearAnswers();state.phase='ineligible';render();return;}
   if(page.review){submit();return;}
   state.page++;state.error='';render();
  });
  document.querySelector('#exit').addEventListener('click',()=>{if(confirm('Dừng khảo sát và xóa câu trả lời chưa gửi?')){clearAnswers();state.phase='withdrawn';render();}});
 }
 if(focus && state.page>0){document.querySelector('#screen-title')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
}
function clearAnswers(){for(const key of Object.keys(answers))delete answers[key];state.submission=null;state.hasAttempted=false;}
function randomHex(bytes){
 if(!window.crypto?.getRandomValues)throw new Error('SECURE_CONTEXT_REQUIRED');
 const data=new Uint8Array(bytes);window.crypto.getRandomValues(data);return Array.from(data,b=>b.toString(16).padStart(2,'0')).join('');
}
function buildSubmission(){
 const normalized=Object.create(null);
 for(const q of allFields)normalized[q.id]=exists(q)?(answers[q.id]??'MISSING'):'NOT_ASKED';
 return {schemaVersion:BANK.version,consentVersion:BANK.consentVersion,studyMode:'PILOT',
  submissionId:randomHex(16),receiptToken:randomHex(32),consent:true,consentAt:state.consentAt,
  elapsedSeconds:Math.max(0,Math.round((Date.now()-state.startedAt)/1000)),
  edReferenceMode:answers.FOCAL_STATUS==='ended'?'retrospective':'current',answers:normalized};
}
function rpcError(code){return Object.assign(new Error(code),{code});}
async function rpc(name,args,timeoutMs=15000){
 if(!['health','submit','receipt'].includes(name)||configProblems().length)throw rpcError('CONFIGURATION_ERROR');
 const controller=new AbortController();let timedOut=false;
 const timer=setTimeout(()=>{timedOut=true;controller.abort();},timeoutMs);
 try{
  const response=await fetch(STORAGE.url.trim()+'/rest/v1/rpc/'+STORAGE.rpcPrefix+name,{
   method:'POST',mode:'cors',credentials:'omit',referrerPolicy:'no-referrer',
   headers:{'Content-Type':'application/json','apikey':STORAGE.publishableKey.trim()},
   body:JSON.stringify(args),signal:controller.signal
  });
  if(response.type==='opaque')throw rpcError('INVALID_RESPONSE');
  if(!response.ok){
   const code=response.status===401||response.status===403?'CONFIGURATION_ERROR':response.status===404?'BACKEND_NOT_INSTALLED':response.status===429?'RATE_LIMITED':response.status>=500?'SERVER_ERROR':'INVALID_RESPONSE';
   throw rpcError(code);
  }
  let value;try{value=await response.json();}catch(_){throw rpcError('INVALID_RESPONSE');}
  if(!value||typeof value!=='object'||Array.isArray(value))throw rpcError('INVALID_RESPONSE');
  return value;
 }catch(error){
  if(timedOut)throw rpcError('SERVER_TIMEOUT');
  if(['CONFIGURATION_ERROR','BACKEND_NOT_INSTALLED','RATE_LIMITED','SERVER_ERROR','INVALID_RESPONSE'].includes(error?.code))throw error;
  throw rpcError('NETWORK_ERROR');
 }finally{clearTimeout(timer);}
}
async function getHealth(){
 try{
  const value=await rpc('health',{});
  if(value.service!=='Beyond the Signals'||value.version!==BANK.version||value.consentVersion!==BANK.consentVersion)return {status:'unavailable',code:'SCHEMA_MISMATCH'};
  if(value.status==='ready'&&value.collectionEnabled===true&&value.storageReady===true)return {status:'ready'};
  if(value.status==='closed'&&value.collectionEnabled===false&&value.storageReady===true)return {status:'closed',code:'COLLECTION_CLOSED'};
  return {status:'unavailable',code:['SCHEMA_MISMATCH','CONFIGURATION_ERROR','SERVER_ERROR'].includes(value.code)?value.code:'INVALID_RESPONSE'};
 }catch(error){return {status:'unavailable',code:error.code||'NETWORK_ERROR'};}
}
function matchingReceipt(value,payload){
 return value&&value.submissionId===payload.submissionId&&value.version===BANK.version&&['saved','pending','rejected'].includes(value.status);
}
async function getReceipt(payload){
 try{
  const value=await rpc('receipt',{p_submission_id:payload.submissionId,p_receipt_token:payload.receiptToken});
  return matchingReceipt(value,payload)?value:null;
 }catch(_){return null;}
}
function confirmSaved(receipt,payload){
 state.lastResult=receipt;state.sending=false;state.phase='success';
 for(const key of Object.keys(answers))delete answers[key];
 state.submission={submissionId:payload.submissionId};render();
}
async function submit(){
 if(state.sending)return;
 if(state.phase==='rejected'&&state.lastResult?.code==='ID_CONFLICT')return;
 if(!isLive){state.phase='previewdone';clearAnswers();render();return;}
 if(configProblems().length){state.error='Cấu hình nghiên cứu chưa hoàn chỉnh.';render();return;}
 try{if(!state.submission)state.submission=buildSubmission();}catch(_){state.error='Trình duyệt chưa hỗ trợ tạo mã phiếu an toàn. Vui lòng dùng trình duyệt cập nhật trên đường dẫn HTTPS.';render();return;}
 state.phase='sending';state.sending=true;state.lastResult=null;render();
 const payload=state.submission;
 if(state.hasAttempted){
  const prior=await getReceipt(payload);
  if(prior?.status==='saved'){confirmSaved(prior,payload);return;}
  if(prior?.status==='rejected'&&prior.code==='ID_CONFLICT'){
   state.lastResult=prior;state.sending=false;state.phase='rejected';render();return;
  }
 }
 const health=await getHealth();state.serverStatus=health.status;state.serverCode=health.code||'';
 if(health.status!=='ready'){
  state.lastResult={code:health.code};state.sending=false;state.phase='connectionfailed';render();return;
 }
 state.hasAttempted=true;
 try{
  const result=await rpc('submit',{p_payload:payload},25000);
  if(!matchingReceipt(result,payload)||!['saved','rejected'].includes(result.status))throw rpcError('INVALID_RESPONSE');
  if(result.status==='saved'){confirmSaved(result,payload);return;}
  state.lastResult={...result,code:['COLLECTION_CLOSED','INVALID_PAYLOAD','SCHEMA_MISMATCH','ID_CONFLICT','CONFIGURATION_ERROR','SERVER_ERROR'].includes(result.code)?result.code:'SERVER_ERROR'};
  state.sending=false;state.phase='rejected';render();return;
 }catch(error){
  // A lost HTTP response may follow a committed insert. Check this same receipt.
  const receipt=await getReceipt(payload);
  if(receipt?.status==='saved'){confirmSaved(receipt,payload);return;}
  state.lastResult={code:error.code||'NETWORK_ERROR'};state.sending=false;state.phase='uncertain';render();
 }
}
function renderSending(){
 const busy=state.phase==='sending';const rejected=state.phase==='rejected';const connectionFailed=state.phase==='connectionfailed';
 const canRetry=!busy&&!(rejected&&state.lastResult?.code==='ID_CONFLICT');
 const reasons={COLLECTION_CLOSED:'Nhóm nghiên cứu đang tạm đóng thu thập dữ liệu.',INVALID_PAYLOAD:'Máy chủ chưa chấp nhận dữ liệu. Vui lòng báo cho nhóm nghiên cứu.',SCHEMA_MISMATCH:'Phiên bản website và cơ sở dữ liệu chưa khớp. Vui lòng báo cho nhóm nghiên cứu.',ID_CONFLICT:'Có xung đột mã phiếu. Vui lòng liên hệ nhóm nghiên cứu; không tạo một phiếu mới ngay.',CONFIGURATION_ERROR:'Cấu hình cơ sở dữ liệu chưa sẵn sàng. Vui lòng báo cho nhóm nghiên cứu.',SERVER_ERROR:'Máy chủ gặp lỗi tạm thời. Bạn có thể thử gửi lại cùng phiếu.'};
 const message=busy?'Đang kiểm tra kết nối, gửi phiếu và chờ xác nhận. Chỉ khi máy chủ xác nhận đã lưu, khảo sát mới hoàn tất.':connectionFailed?serverMessage()+(state.hasAttempted?' Lần gửi trước có thể đã được lưu. Hãy giữ trang và kiểm tra lại cùng phiếu.':' Câu trả lời chưa được gửi. Hãy giữ trang và thử lại.'):rejected?(reasons[state.lastResult?.code]||'Máy chủ chưa chấp nhận phiếu. Vui lòng liên hệ nhóm nghiên cứu.'):'Kết nối có thể chậm hoặc máy chủ chưa phản hồi. Dữ liệu có thể đã được lưu; đừng làm một phiếu mới. Thử lại sẽ dùng nguyên mã phiếu để tránh ghi trùng.';
 app.innerHTML=`<section class="completion"><div class="kicker">${busy?'Đang xác nhận từ máy chủ':'Trạng thái gửi phiếu'}</div>${busy?'<div class="spinner" role="status" aria-label="Đang gửi"></div>':'<div class="symbol" aria-hidden="true">○</div>'}<h2 id="screen-title" tabindex="-1">${busy?'Một chút nữa thôi.':rejected||connectionFailed?'Chưa thể hoàn tất.':'Chưa nhận được xác nhận.'}</h2><p role="status">${esc(message)}</p><p class="hint">Giữ trang này mở để không mất khả năng gửi lại cùng phiếu. Không có câu trả lời nào được hiển thị công khai.</p>${state.submission?`<p class="hint">Mã phiếu để liên hệ</p><p class="receipt">${esc(state.submission.submissionId)}</p>`:''}${canRetry?'<div class="actions center-actions"><button class="button primary" id="retry">Kiểm tra / gửi lại cùng phiếu</button></div>':''}<p class="hint">Liên hệ nghiên cứu: ${displayConfig('contactEmail')}</p></section>`;
 document.querySelector('#retry')?.addEventListener('click',submit);
 document.querySelector('#screen-title')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});
}
function renderEnd(){
 const success=state.phase==='success',preview=state.phase==='previewdone';
 const title=success?'THANK YOU.':preview?'HOÀN TẤT XEM THỬ.':'CẢM ƠN BẠN.';
 const text=success?'Máy chủ đã xác nhận lưu câu trả lời của bạn vào cơ sở dữ liệu nghiên cứu.':preview?'Bạn đã đi hết bảng hỏi. Đây là bản xem thử; không có dữ liệu nào được gửi hoặc lưu lên cơ sở dữ liệu.':state.phase==='ineligible'?'Bạn chưa thuộc phạm vi tham gia của phiên bản khảo sát này. Không có câu trả lời nào được gửi lên máy chủ.':'Bạn đã dừng khảo sát. Câu trả lời chưa gửi đã được xóa khỏi bộ nhớ của trang.';
 app.innerHTML=`<section class="completion"><div class="symbol" aria-hidden="true">${success?'✓':'✧'}</div><h1 id="screen-title" tabindex="-1">${title}</h1><p>${text}</p>${success?`<div class="panel"><div class="kicker">Mã phiếu của bạn</div><p class="receipt">${esc(state.submission.submissionId)}</p><p class="hint">Bạn có thể lưu riêng mã này để liên hệ nhóm nghiên cứu về phiếu đã gửi. Không công khai mã phiếu.</p></div>`:''}${(success||preview)?'<p class="hint">Bảng hỏi không chẩn đoán sức khỏe tâm lý hoặc kết luận động cơ của đối phương. Nếu nội dung gợi cảm xúc khó chịu, bạn có thể nghỉ ngơi và trao đổi với người đáng tin cậy hoặc tìm sự hỗ trợ chuyên môn.</p>':''}<p class="hint">${isLive?'Liên hệ: '+displayConfig('contactEmail'):'Đóng trang để kết thúc.'}</p></section>`;
 document.querySelector('#screen-title')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('beforeunload',e=>{
 if(state.phase==='survey' && state.page>0 || ['sending','uncertain','rejected','connectionfailed'].includes(state.phase)){
  e.preventDefault();e.returnValue='';
 }
});
render(false);
</script>
