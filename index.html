
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the Signals | Research Survey</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050507;color:#fff;font-family:Inter,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 15% 20%,#fff 90%,transparent),radial-gradient(1px 1px at 80% 35%,#fff 90%,transparent),radial-gradient(1px 1px at 40% 75%,#fff 90%,transparent);background-size:240px 260px;opacity:.25}
main{position:relative;max-width:680px;margin:auto;padding:42px 22px 70px}
h1{font-size:clamp(38px,8vw,56px);line-height:1.08;letter-spacing:-2px}
h2{font-size:clamp(28px,5vw,34px)}
p{font-size:17px;line-height:1.75;color:#d0d0d8}
.eyebrow{font-size:13px;letter-spacing:3px;color:#b8b8c4;font-weight:600}
.center{text-align:center}
.halo{width:165px;height:165px;border-radius:50%;margin:42px auto;border:2px solid #eee;box-shadow:0 0 30px #fff8,0 0 100px #fff3,inset 0 0 30px #fff3}
.panel{padding:24px;background:#111115;border:1px solid #404048;border-radius:18px;margin:30px 0}
.question{font-size:18px;font-weight:600;line-height:1.6;margin:32px 0 16px}
.option{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid #44444c;border-radius:14px;background:#111115;margin:10px 0;font-size:16px;cursor:pointer}
.option:has(input:checked){border-color:#fff;background:#26262b;box-shadow:0 0 20px #ffffff20}
input[type=radio],input[type=checkbox]{width:20px;height:20px;accent-color:white;flex-shrink:0}
button{font-size:16px;padding:16px 27px;border-radius:32px;cursor:pointer}
.primary{background:white;color:#050507;border:0;font-weight:700;box-shadow:0 0 25px #ffffff35}
.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{background:transparent;color:white;border:1px solid #555}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:32px}
.progress{height:5px;background:#333;border-radius:8px;margin:22px 0 34px;overflow:hidden}
.progress div{height:100%;background:white;box-shadow:0 0 15px white}
.error{padding:14px;border-left:3px solid white;background:#ffffff18;margin-top:20px}
footer{text-align:center;color:#999;font-size:13px;margin-top:65px}
@media(max-width:420px){.actions button{padding:14px 18px}}
</style>
</head>
<body>
<main>
<div id="app"></div>
<footer>COSMIC MONOCHROME · RESEARCH SURVEY</footer>
</main>

<script>
// Dán URL Web App Google Apps Script vào đây.
// Để trống để chạy ở chế độ xem thử.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5-vnXr_1os4JPeVTPDOtxObuSRzvPpLLvNTuytm7WCdmf7zdpwi-dKLvQVq0JUYLE/exec";

const sections = [
{
 title:"Thông tin tham gia",
 description:"Một vài thông tin cơ bản về bạn.",
 questions:[
  {id:"AGE",text:"Bạn thuộc nhóm tuổi nào?",options:["Dưới 18 tuổi","18–22 tuổi","23–26 tuổi","27–30 tuổi","Trên 30 tuổi"]},
  {id:"EXP",text:"Trong 12 tháng gần đây, bạn có trải qua giai đoạn tìm hiểu hoặc quan hệ tình cảm không?",options:["Có","Không"]}
 ]
},
{
 title:"Trải nghiệm tình cảm",
 description:"Hãy nghĩ về một người mà bạn từng hoặc đang có sự quan tâm tình cảm.",
 questions:[
  {id:"BR01",text:"Người đó có lúc thể hiện sự quan tâm rõ rệt nhưng sau đó đột ngột trở nên xa cách."},
  {id:"BR02",text:"Tôi từng nhận được tín hiệu tình cảm khiến mình hy vọng, dù đối phương không thể hiện ý định cam kết rõ ràng."},
  {id:"BR03",text:"Sự quan tâm của người đó xuất hiện và biến mất một cách khó dự đoán."}
 ]
},
{
 title:"Nhạy cảm với sự từ chối",
 description:"Hãy đánh giá mức độ đồng ý của bạn.",
 questions:[
  {id:"RS01",text:"Tôi thường lo lắng rằng người mình quan tâm có thể từ chối mình."},
  {id:"RS02",text:"Khi đối phương ít phản hồi, tôi dễ nghĩ rằng họ không còn muốn gần gũi với mình."},
  {id:"RS03",text:"Những dấu hiệu bị từ chối khiến tôi cảm thấy bất an."}
 ]
},
{
 title:"Sự lệ thuộc cảm xúc",
 description:"Hãy đánh giá các trải nghiệm cảm xúc dưới đây.",
 questions:[
  {id:"ED01",text:"Tâm trạng của tôi phụ thuộc nhiều vào cách người đó đối xử với mình."},
  {id:"ED02",text:"Tôi cảm thấy khó ổn định cảm xúc khi không nhận được sự quan tâm từ người đó."},
  {id:"ED03",text:"Tôi gặp khó khăn khi tạo khoảng cách cảm xúc với người đó, ngay cả khi mối quan hệ khiến tôi mệt mỏi."}
 ]
}
];

const likert=[
"Hoàn toàn không đồng ý",
"Không đồng ý",
"Trung lập",
"Đồng ý",
"Hoàn toàn đồng ý"
];

let step=0;
let consent=false;
let answers={};
let sending=false;
let errorMessage="";
const app=document.getElementById("app");

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

function render(){
 if(step===0){
  app.innerHTML=`
  <div class="center">
   <div class="eyebrow">PSYCHOLOGICAL RESEARCH · PILOT</div>
   <div class="halo"></div>
   <h1>BEYOND<br>THE SIGNALS</h1>
   <p>Khảo sát về trải nghiệm tình cảm, sự nhạy cảm với từ chối và lệ thuộc cảm xúc ở người trẻ.</p>
  </div>
  <div class="panel">
   <div class="eyebrow">ĐỒNG THUẬN THAM GIA</div>
   <p>Đây là khảo sát thử nghiệm. Việc tham gia là tự nguyện. Bạn có thể dừng trước khi gửi câu trả lời. Không yêu cầu thông tin định danh cá nhân.</p>
   <label class="option">
    <input type="checkbox" id="agree" ${consent?"checked":""}>
    Tôi từ 18 tuổi trở lên và đồng ý tham gia.
   </label>
  </div>
  <div class="center">
   <button class="primary" id="start" ${consent?"":"disabled"}>Bắt đầu khảo sát →</button>
  </div>`;
  document.getElementById("agree").onchange=e=>{
   consent=e.target.checked;render();
  };
  document.getElementById("start").onclick=()=>{
   step=1;render();
  };
  return;
 }

 if(step===5 || step===6){
  app.innerHTML=`
  <div class="center" style="padding:80px 0">
   <div style="font-size:60px;text-shadow:0 0 30px white">✧</div>
   <h1>${step===5?"THANK YOU.":"CẢM ƠN BẠN."}</h1>
   <p>${step===5
     ?(SCRIPT_URL?"Câu trả lời đã được gửi thành công.":"Bạn đã hoàn thành bản xem thử. Dữ liệu chưa được lưu.")
     :"Bạn chưa thuộc nhóm đối tượng của khảo sát này."}</p>
   <button class="secondary" id="restart">Quay lại trang đầu</button>
  </div>`;
  document.getElementById("restart").onclick=()=>{
   step=0;consent=false;answers={};render();
  };
  return;
 }

 const section=sections[step-1];
 let html=`
 <div class="eyebrow">KHẢO SÁT · ${String(step).padStart(2,"0")} / 04</div>
 <div class="progress"><div style="width:${step/4*100}%"></div></div>
 <h2>${escapeHTML(section.title)}</h2>
 <p>${escapeHTML(section.description)}</p>`;

 section.questions.forEach((q,i)=>{
  html+=`<div class="question">${i+1}. ${escapeHTML(q.text)}</div>`;
  (q.options||likert).forEach((option,j)=>{
   const value=q.options?option:String(j+1);
   html+=`
   <label class="option">
    <input type="radio" name="${q.id}" value="${escapeHTML(value)}"
    ${answers[q.id]===value?"checked":""}>
    <span>${escapeHTML(option)}</span>
   </label>`;
  });
 });

 if(errorMessage)html+=`<div class="error">${escapeHTML(errorMessage)}</div>`;
 html+=`
 <div class="actions">
  <button class="secondary" id="back">← Quay lại</button>
  <button class="primary" id="next" ${sending?"disabled":""}>
   ${sending?"Đang gửi...":step===4?"Gửi khảo sát →":"Tiếp tục →"}
  </button>
 </div>`;
 app.innerHTML=html;

 app.querySelectorAll('input[type="radio"]').forEach(input=>{
  input.onchange=()=>{
   answers[input.name]=input.value;
   errorMessage="";
  };
 });

 document.getElementById("back").onclick=()=>{
  if(sending)return;
  step--;errorMessage="";render();
 };

 document.getElementById("next").onclick=async()=>{
  if(sending)return;
  if(section.questions.some(q=>!answers[q.id])){
   errorMessage="Vui lòng trả lời đầy đủ các câu hỏi.";
   render();return;
  }
  if(step===1 &&
   (answers.AGE==="Dưới 18 tuổi"||
    answers.AGE==="Trên 30 tuổi"||
    answers.EXP==="Không")){
    step=6;render();return;
  }
  if(step<4){step++;errorMessage="";render();return;}
  await submitSurvey();
 };
}

async function submitSurvey(){
 if(!SCRIPT_URL){step=5;render();return;}
 sending=true;errorMessage="";render();
 try{
  // Apps Script Web App nhận form POST.
  const form=new URLSearchParams();
  form.set("payload",JSON.stringify({
   surveyVersion:"pilot-1.0",
   consent:true,
   answers
  }));
  // no-cors không cho phép xác minh kết quả lưu.
  // Không hiển thị thành công khi chưa xác minh được.
  await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:form});
  errorMessage="Yêu cầu đã được gửi, nhưng trình duyệt không thể xác minh Google Sheets đã lưu dữ liệu. Hãy kiểm tra bảng tính trước khi coi là hoàn tất.";
 }catch(e){
  errorMessage="Không thể gửi dữ liệu. Vui lòng thử lại.";
 }
 sending=false;render();
}
render();
</script>
</body>
</html>
